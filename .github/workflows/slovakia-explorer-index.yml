name: Build Slovakia Europe Explorer index

# Rebuild the derived manifest after canonical Slovak record/sequence changes.

on:
  push:
    branches: [main]
    paths:
      - 'data/slovakia/records/**'
      - 'data/slovakia/sequence.json'
      - 'scripts/build-slovakia-explorer-index.mjs'
      - '.github/workflows/slovakia-explorer-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slovakia-explorer-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build published V5 index
        run: node scripts/build-slovakia-explorer-index.mjs

      - name: Commit index when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/slovakia/
          if git diff --cached --quiet; then
            echo "Explorer index is already up to date."
            exit 0
          fi
          git commit -m "chore: rebuild Slovak Europe Explorer index"
          git push
