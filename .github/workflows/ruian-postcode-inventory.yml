name: RUIAN nationwide postcode inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 2 * *"
  push:
    paths:
      - ".github/workflows/ruian-postcode-inventory.yml"
      - "scripts/ruian_postcode_inventory.py"

permissions:
  contents: write

jobs:
  build-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and process official ČÚZK RÚIAN CSV
        run: python scripts/ruian_postcode_inventory.py
      - name: Publish permanent reference data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/czechia/reference
          cp ruian-output/ruian_postcodes.json data/czechia/reference/ruian_postcodes.json
          cp ruian-output/ruian_postcodes.csv data/czechia/reference/ruian_postcodes.csv
          cp ruian-output/ruian_import_manifest.json data/czechia/reference/ruian_import_manifest.json
          git add data/czechia/reference/
          if git diff --cached --quiet; then
            echo "RÚIAN reference data is unchanged; no commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(czechia): refresh official RÚIAN postcode reference"
          git push
      - name: Upload inventory artifact (secondary backup)
        uses: actions/upload-artifact@v4
        with:
          name: ruian-nationwide-postcode-inventory
          path: ruian-output/
          if-no-files-found: error
          retention-days: 30
