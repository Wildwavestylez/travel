<!doctype html>
<!-- Fresh Pages deployment after duplicate artifact retry. -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TRAVEL — Supabase Archive</title>
<link rel="stylesheet" href="./supabase.css?v=20261122-1">
</head>
<body>
<div class="app">
<header>
  <div class="brand-block">
    <div class="brand">TRAVEL / SUPABASE</div>
    <div id="subtitle" class="subtitle">Samostatná čtečka původních záznamů z databáze Supabase</div>
  </div>
  <div class="toolbar">
    <div class="switch-group" aria-label="Country">
      <button class="switch active" data-country="DE">🇩🇪 Deutschland</button>
      <button class="switch" data-country="CZ">🇨🇿 Česko</button>
    </div>
    <div class="switch-group language" aria-label="Language">
      <button class="switch active" data-language="cs">CS</button>
      <button class="switch" data-language="de">DE</button>
    </div>
    <input id="search" type="search" autocomplete="off" placeholder="Hledat PSČ nebo město…">
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head"><strong id="listTitle">PSČ</strong><span id="count" class="count">Načítám…</span></div>
    <div id="list" class="list"><div class="loading">Načítám záznamy ze Supabase…</div></div>
    <div class="pager"><button id="prev" disabled>← Předchozí</button><button id="next" disabled>Další →</button></div>
  </aside>
  <main class="main"><div id="detail"><div class="empty">Načítám databázi…</div></div></main>
</div>
<footer><span id="footerText">Pouze čtení · Supabase public.postal_codes · DE / CZ</span><a href="./database.html">Otevřít hlavní Database</a></footer>
</div>
<script src="./supabase.js?v=20261122-1"></script>
</body>
</html>
